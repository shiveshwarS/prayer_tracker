name: prayer_tracker
description: "Noor - a calm, local-first Muslim prayer companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0-116.0.dev

dependencies:
  flutter:
    sdk: flutter
  adhan_dart: 2.0.1
  flutter_compass: 0.8.1
  geolocator: 13.0.4
  shared_preferences: ^2.5.4
  alarm: ^4.1.1
  permission_handler: ^11.4.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.1
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/sounds/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
