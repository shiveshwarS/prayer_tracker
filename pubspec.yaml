name: prayer_tracker
description: "Noor - a calm, local-first Muslim prayer companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0-116.0.dev

dependencies:
  flutter:
    sdk: flutter
  adhan_dart: 2.0.1
  flutter_compass: 0.8.1
  geolocator: 13.0.4
  shared_preferences: 2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
